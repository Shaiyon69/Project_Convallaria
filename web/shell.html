<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Convallaria</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #ddd;
         font: 20px sans-serif; text-align: center; padding: 16px; pointer-events: none; }
  @media (orientation: portrait) and (pointer: coarse) { #turn { display: block !important; } }
  #turn { display: none; position: fixed; inset: 0; background: #000d; color: #fff; font: 22px sans-serif;
          padding-top: 40vh; text-align: center; pointer-events: none; }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<div id="msg">Loading...</div>
<div id="turn">Turn your phone sideways to play</div>
<script>
  var msg = document.getElementById('msg');
  var Module = {
    canvas: document.getElementById('canvas'),
    setStatus: function (t) { msg.textContent = t ? t.replace(/\(.*\)/, '') : ''; },
    onRuntimeInitialized: function () { msg.textContent = ''; },
  };
  // Phones: going full screen on the first tap hides the browser bars.
  document.addEventListener('touchend', function () {
    var el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(function () {});
  }, { once: true });
</script>
{{{ SCRIPT }}}
</body>
</html>
